name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]




jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build

  # Add this job to analyze failures
  analyze-failures:
    runs-on: ubuntu-latest
    needs: [build]  # Run after your main jobs
    if: failure()   # Only runs when previous jobs fail
    steps:
      - name: Analyze with SenseTheLog
        uses: sensethelog/action@v1
        with:
          sensethelog-api-key: ${{ secrets.SENSETHELOG_API_KEY }}