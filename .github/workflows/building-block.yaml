name: Building Blocks

on: push

jobs:
    echo-hello: 
        runs-on: ubuntu-latest
        steps:
            - name: Say hello
              run: echo "hello, world"
    
    echo-goodbye: 
        runs-on: ubuntu-latest
        steps: 
            - name: Failed Step
              run: | #| is used for multiple commands ..exit 1 -> code failed ...will skip the next step
                echo "This step will fail"
                exit 1 
            - name: Say goodbye
              run: echo "Goodbye, World!"